[package]
name = "rawfy-core"
version = "0.2.0"
edition = "2021"
description = "High-performance web perception core engine for AI agents in Rust"
license = "MIT"
authors = ["rishiiicreates"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "multipart"] }
scraper = "0.22"
url = "2.5"
regex = "1.11"
readability = "0.3"
html2md = "0.2"
thiserror = "2.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
