[package]
name = "rawfy-cli"
version = "0.2.1"
edition = "2021"
description = "Rawfy CLI, MCP stdio server, and REST API in Rust"
license = "MIT"
authors = ["rishiiicreates"]

[[bin]]
name = "rawfy"
path = "src/main.rs"

[dependencies]
rawfy-core = { path = "../rawfy-core" }
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
